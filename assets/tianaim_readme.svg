<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">TianAim auto-aim runtime chain</title>
  <desc id="desc">Animated diagram showing the camera, detector, USB CDC link, STM32 firmware, DBUS remote input, and gimbal control loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10233a"/>
      <stop offset="0.46" stop-color="#143f4a"/>
      <stop offset="1" stop-color="#2d2a12"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d5ff"/>
      <stop offset="0.55" stop-color="#45f0b7"/>
      <stop offset="1" stop-color="#f8d14a"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-30%" width="130%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020815" flood-opacity="0.38"/>
    </filter>
    <style>
      .title { font: 700 54px Arial, Helvetica, sans-serif; fill: #f7fbff; letter-spacing: 0; }
      .subtitle { font: 500 20px Arial, Helvetica, sans-serif; fill: #c9f6ff; letter-spacing: 0; }
      .label { font: 700 20px Arial, Helvetica, sans-serif; fill: #f9fdff; letter-spacing: 0; }
      .small { font: 500 14px Arial, Helvetica, sans-serif; fill: #bdebf4; letter-spacing: 0; }
      .pillText { font: 700 17px Arial, Helvetica, sans-serif; fill: #0c1821; letter-spacing: 0; }
      .card { fill: rgba(255, 255, 255, 0.11); stroke: rgba(255, 255, 255, 0.32); stroke-width: 1.4; }
      .wire { fill: none; stroke: url(#line); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 18 16; }
      .dot { fill: #f8d14a; }
      @keyframes flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -68; } }
      @keyframes pulse { 0%, 100% { opacity: 0.45; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
      @keyframes sweep { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(190px); } }
      .wire { animation: flow 2.2s linear infinite; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-in-out infinite; }
      .sweep { animation: sweep 2.8s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1100" height="360" rx="0" fill="url(#bg)"/>
  <g opacity="0.28">
    <path d="M70 72 C210 18 337 110 484 58 S822 34 1030 92" fill="none" stroke="#8feaff" stroke-width="2"/>
    <path d="M42 298 C208 244 288 324 474 270 S780 230 1044 286" fill="none" stroke="#ffe278" stroke-width="2"/>
  </g>

  <g transform="translate(56 54)">
    <text class="title" x="0" y="0">TianAim</text>
    <text class="subtitle" x="4" y="40">ROS2 perception + STM32 gimbal control</text>
  </g>

  <g transform="translate(56 120)" filter="url(#softShadow)">
    <rect class="card" x="0" y="0" width="164" height="86" rx="8"/>
    <text class="label" x="24" y="34">hik_camera</text>
    <text class="small" x="24" y="60">image_raw / hbmem</text>
  </g>
  <g transform="translate(272 120)" filter="url(#softShadow)">
    <rect class="card" x="0" y="0" width="194" height="86" rx="8"/>
    <text class="label" x="24" y="34">armor detect</text>
    <text class="small" x="24" y="60">/dnn_node_sample</text>
  </g>
  <g transform="translate(520 120)" filter="url(#softShadow)">
    <rect class="card" x="0" y="0" width="190" height="86" rx="8"/>
    <text class="label" x="24" y="34">bridge</text>
    <text class="small" x="24" y="60">0xFA target frame</text>
  </g>
  <g transform="translate(770 120)" filter="url(#softShadow)">
    <rect class="card" x="0" y="0" width="250" height="86" rx="8"/>
    <text class="label" x="24" y="34">STM32 firmware</text>
    <text class="small" x="24" y="60">vision_input -> gimbal_task</text>
  </g>

  <path class="wire" d="M220 163 H270"/>
  <path class="wire" d="M466 163 H520"/>
  <path class="wire" d="M710 163 H770"/>
  <g class="sweep">
    <circle class="dot" cx="258" cy="163" r="8"/>
  </g>
  <g class="sweep" style="animation-delay: .7s">
    <circle class="dot" cx="504" cy="163" r="8"/>
  </g>
  <g class="sweep" style="animation-delay: 1.4s">
    <circle class="dot" cx="748" cy="163" r="8"/>
  </g>

  <g transform="translate(528 232)">
    <rect x="0" y="0" width="170" height="36" rx="8" fill="#45f0b7"/>
    <text class="pillText" x="28" y="24">USB-CDC main</text>
  </g>
  <g transform="translate(770 244)">
    <path d="M0 0 C-92 46 -182 46 -270 0" fill="none" stroke="#45f0b7" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 12">
      <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>
  <g transform="translate(772 244)">
    <rect x="0" y="0" width="156" height="36" rx="8" fill="#f8d14a"/>
    <text class="pillText" x="26" y="24">DBUS remote</text>
  </g>
  <circle class="pulse" cx="1030" cy="163" r="16" fill="#f8d14a"/>
  <text class="small" x="960" y="238">active mainline, compact docs, hardware-first validation</text>
</svg>
