rm_vehicle_detection:
  ros__parameters:
    image_topic: "/hbmem_img"
    output_topic: "/vehicle_detection/targets"
    target_type: "vehicle"
    box_format: "cxcywh"
    score_threshold: 0.10
    nms_threshold: 0.45
    nms_top_k: 300
    task_num: 4
    log_fps: false
    publish_debug_text: false
    debug_anchor_logs: false
    sample_roi_logs: false
