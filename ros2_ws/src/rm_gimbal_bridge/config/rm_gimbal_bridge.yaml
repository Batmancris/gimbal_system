rm_gimbal_bridge:
  ros__parameters:
    input_topic: "/vehicle_detection/targets"
    serial_port: "/dev/ttyS1"
    baud_rate: 921600
    image_width: 1280
    image_height: 1024
    image_center_x: 640.0
    image_center_y: 512.0
    min_confidence: 0.35
    enemy_prefix: ""
    allowed_target_types: ["vehicle"]
    selection_mode: "closest"
    log_selected_target: true
    follow_control_mode: "light_predict"
    follow_smoothing_alpha: 0.65
    follow_max_step_px: 72.0
    follow_deadband_px: 6.0
    light_follow_gain: 0.95
    center_gate_x_ratio: 0.35
    center_gate_y_ratio: 0.30
    pid_kp: 0.55
    pid_ki: 0.0
    pid_kd: 0.08
    pid_integral_limit_px: 160.0
    predict_alpha: 0.55
    predict_beta: 0.10
    predict_horizon_sec: 0.03
