# Fallback / legacy vehicle-oriented defaults.
# 当前 TianAim v1 headless fast_best bear-follow baseline 不直接依赖这些默认值。
# 推荐入口 start_fast_follow_verified.sh 会通过 run_rm_bridge_loop.sh 和
# --ros-args -p 覆盖为 bear-follow 参数。
# 不要因为看到此文件中的 vehicle 默认值，就误认为当前 baseline 是 vehicle pipeline。
rm_gimbal_bridge:
  ros__parameters:
    input_topic: "/vehicle_detection/targets"
    serial_port: "/dev/ttyS1"
    baud_rate: 921600
    image_width: 1280
    image_height: 1024
    image_center_x: 640.0
    image_center_y: 512.0
    min_confidence: 0.18
    enemy_prefix: ""
    allowed_target_types: ["vehicle"]
    selection_mode: "closest"
    log_selected_target: false
    log_diag_feedback: false
    enable_fixed_rate_follow: true
    follow_send_rate_hz: 50.0
    follow_control_mode: "light_predict"
    follow_interp_rate_hz: 8.0
    follow_smoothing_alpha: 0.35
    follow_max_step_px: 36.0
    follow_deadband_px: 10.0
    fast_follow_error_px: 120.0
    fast_follow_smoothing_alpha: 0.55
    fast_follow_max_step_px: 72.0
    light_follow_gain: 0.45
    center_gate_x_ratio: 0.55
    center_gate_y_ratio: 0.50
    pid_kp: 0.55
    pid_ki: 0.0
    pid_kd: 0.08
    pid_integral_limit_px: 160.0
    predict_alpha: 0.30
    predict_beta: 0.00
    predict_horizon_sec: 0.00
    target_hold_ms: 500
    target_switch_radius_px: 96.0
    target_switch_min_conf_gain: 0.12
    target_switch_center_gain_px: 80.0
    min_send_delta_px: 2.0
    send_keepalive_ms: 40
